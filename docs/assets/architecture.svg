<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">ForgeSpec MCP Protocol 2.0 Architecture</title>
  <desc id="desc">Architecture diagram showing OpenCode plugin, identity broker sidecar, MCP stdio server, tool catalog, domain services, and SQLite storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/>
    </marker>
    <marker id="purpleArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c084fc"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 800; fill: #f8fafc; font-size: 20px; letter-spacing: 0.5px; }
      .subtitle { fill: #94a3b8; font-size: 12px; }
      .box-title { font-weight: 700; fill: #f1f5f9; font-size: 14px; }
      .box-desc { fill: #94a3b8; font-size: 11px; }
      .badge-text { font-weight: 600; font-size: 10px; fill: #38bdf8; }
      .table-text { fill: #cbd5e1; font-size: 11px; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashed-arrow { stroke: #c084fc; stroke-width: 2; stroke-dasharray: 4,4; fill: none; marker-end: url(#purpleArrow); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect width="28" height="28" rx="6" fill="url(#cyanAccent)"/>
    <text x="14" y="19" text-anchor="middle" font-size="14" font-weight="900" fill="#0f172a">FS</text>
    <text x="38" y="21" class="title">ForgeSpec MCP Protocol 2.0</text>
    <text x="345" y="21" class="subtitle">— SDD Multi-Agent Coordination &amp; Safe Identity Broker</text>
  </g>

  <!-- Left: Identity Boundary & OpenCode Sidecar -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="320" height="235" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="36" rx="12" fill="#1e293b"/>
    <rect x="0" y="24" width="320" height="12" fill="#1e293b"/>
    <circle cx="20" cy="18" r="4" fill="#38bdf8"/>
    <text x="32" y="22" class="box-title">OpenCode Integration Layer</text>
    
    <!-- Plugin Box -->
    <rect x="16" y="50" width="288" height="70" rx="8" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="28" y="72" font-size="13" font-weight="700" fill="#38bdf8">opencode-forgespec Plugin</text>
    <text x="28" y="90" class="box-desc">• Intercepts tool.execute.before</text>
    <text x="28" y="106" class="box-desc">• Lineage resolution &amp; session caching</text>

    <!-- Identity Broker Box -->
    <rect x="16" y="132" width="288" height="88" rx="8" fill="#090d16" stroke="#6366f1" stroke-width="1"/>
    <text x="28" y="154" font-size="13" font-weight="700" fill="#818cf8">Identity Broker (Private Stdio)</text>
    <text x="28" y="172" class="box-desc">• Shell-free subprocess (shell: false)</text>
    <text x="28" y="188" class="box-desc">• Signs _identity context envelope</text>
    <text x="28" y="204" class="box-desc">• 5 Tables: fsi_meta, fsi_keys, fsi_workers...</text>
  </g>

  <!-- Right: Entrypoint & MCP Server -->
  <g transform="translate(400, 75)" filter="url(#shadow)">
    <rect width="520" height="235" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="36" rx="12" fill="#1e293b"/>
    <rect x="0" y="24" width="520" height="12" fill="#1e293b"/>
    <circle cx="20" cy="18" r="4" fill="#34d399"/>
    <text x="32" y="22" class="box-title">MCP Protocol 2.0 Server Core (src/index.ts)</text>

    <!-- Stdio Gate -->
    <rect x="16" y="50" width="488" height="54" rx="8" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="28" y="72" font-size="13" font-weight="700" fill="#34d399">Stdio Transport &amp; Fail-Closed Gate</text>
    <text x="28" y="90" class="box-desc">Clean JSON-RPC on stdout • Diagnostics on stderr • Strict preflight validation</text>

    <!-- Tool Dispatcher -->
    <rect x="16" y="116" width="488" height="104" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="1"/>
    <text x="28" y="138" font-size="13" font-weight="700" fill="#38bdf8">Canonical 18 Tool Modules &amp; Profiles</text>
    <text x="28" y="158" class="table-text">contracts · core · planning · leases · governance · execution</text>
    <text x="28" y="178" class="box-desc">Profiles: planner · worker · orchestrator · reviewer (deterministic sets)</text>
    <text x="28" y="196" class="box-desc">Security: Identity context injected; actor fields rejected from arguments</text>
  </g>

  <!-- Arrow between Broker and MCP Server -->
  <path class="dashed-arrow" d="M304 220 C 350 220, 360 170, 400 170"/>
  <text x="350" y="190" text-anchor="middle" font-size="10" fill="#c084fc" font-weight="600">_identity</text>

  <!-- Middle: Domain Logic & Security Services -->
  <g transform="translate(40, 330)" filter="url(#shadow)">
    <rect width="880" height="120" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="32" rx="12" fill="#1e293b"/>
    <rect x="0" y="20" width="880" height="12" fill="#1e293b"/>
    <circle cx="20" cy="16" r="4" fill="#fbbf24"/>
    <text x="32" y="20" class="box-title">Domain Logic, Invariants &amp; Concurrency Control</text>

    <g transform="translate(16, 42)">
      <!-- Box 1 -->
      <rect width="202" height="64" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
      <text x="12" y="22" font-size="12" font-weight="700" fill="#f8fafc">SDD Phase Machine</text>
      <text x="12" y="40" class="box-desc">init → explore → proposal</text>
      <text x="12" y="54" class="box-desc">spec → design → tasks → apply</text>
      
      <!-- Box 2 -->
      <rect x="214" width="202" height="64" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
      <text x="226" y="22" font-size="12" font-weight="700" fill="#f8fafc">Optimistic CAS &amp; Leases</text>
      <text x="226" y="40" class="box-desc">Scoped path exclusivity</text>
      <text x="226" y="54" class="box-desc">Bounded attempt &amp; lease TTL</text>

      <!-- Box 3 -->
      <rect x="428" width="202" height="64" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
      <text x="440" y="22" font-size="12" font-weight="700" fill="#f8fafc">Authority &amp; Approvals</text>
      <text x="440" y="40" class="box-desc">1-time issued tokens (hashed)</text>
      <text x="440" y="54" class="box-desc">HMAC cursor key ring rotation</text>

      <!-- Box 4 -->
      <rect x="642" width="206" height="64" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
      <text x="654" y="22" font-size="12" font-weight="700" fill="#f8fafc">Audit &amp; Idempotency</text>
      <text x="654" y="40" class="box-desc">SHA-256 hash chains</text>
      <text x="654" y="54" class="box-desc">Immutable trigger enforcement</text>
    </g>
  </g>

  <!-- Connectors: Server to Domain -->
  <path class="arrow" d="M660 310v20"/>

  <!-- Bottom: 16 Table SQLite Storage -->
  <g transform="translate(40, 470)" filter="url(#shadow)">
    <rect width="880" height="125" rx="12" fill="url(#blueCard)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="880" height="32" rx="12" fill="#1e293b"/>
    <rect x="0" y="20" width="880" height="12" fill="#1e293b"/>
    <circle cx="20" cy="16" r="4" fill="#38bdf8"/>
    <text x="32" y="20" class="box-title">Storage Layer: Qualified 16-Table STRICT SQLite Store (fs_*)</text>
    <text x="680" y="20" font-size="11" fill="#38bdf8" font-weight="600">WAL Mode · JSON1 · Foreign Keys</text>

    <g transform="translate(16, 42)">
      <rect width="848" height="70" rx="6" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" class="table-text">fs_schema_meta · fs_boards · fs_tasks · fs_task_dependencies · fs_gates · fs_gate_decisions</text>
      <text x="14" y="42" class="table-text">fs_attempts · fs_contracts · fs_leases · fs_lease_scopes · fs_authority · fs_authority_revocations</text>
      <text x="14" y="62" class="table-text">fs_approvals · fs_audit_events · fs_evidence · fs_idempotency</text>
    </g>
  </g>

  <!-- Connectors: Domain to Storage -->
  <path class="arrow" d="M480 450v20"/>

</svg>
