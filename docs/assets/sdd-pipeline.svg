<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">ForgeSpec SDD 2.0 Lifecycle Pipeline</title>
  <desc id="desc">Ordered phases of Spec-Driven Development: init, explore, proposal, spec, design, tasks, apply, verify.</desc>
  <defs>
    <linearGradient id="sddBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pInit" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="pExplore" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="pProposal" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="pSpec" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
    <linearGradient id="pDesign" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="pTasks" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#eab308"/><stop offset="100%" stop-color="#a16207"/></linearGradient>
    <linearGradient id="pApply" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="pVerify" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <marker id="pipeArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#64748b"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .p-title { font-weight: 700; font-size: 13px; fill: #ffffff; }
      .p-desc { font-size: 9.5px; fill: #cbd5e1; }
      .p-num { font-size: 10px; font-weight: 800; fill: rgba(255,255,255,0.7); }
      .header-t { font-size: 16px; font-weight: 800; fill: #f8fafc; }
      .header-sub { font-size: 11px; fill: #94a3b8; }
      .arrow-line { stroke: #64748b; stroke-width: 1.5; marker-end: url(#pipeArrow); }
    </style>
  </defs>

  <rect width="960" height="300" rx="16" fill="url(#sddBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(35, 25)">
    <text x="0" y="0" class="header-t">Spec-Driven Development (SDD) 2.0 Lifecycle</text>
    <text x="0" y="18" class="header-sub">Deterministic phase transitions with cryptographic revisioning, attempt gating, and evidence references</text>
  </g>

  <!-- Pipeline Steps -->
  <g transform="translate(35, 75)">
    <!-- 1: init -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="95" height="110" rx="8" fill="url(#pInit)"/>
      <text x="10" y="22" class="p-num">01</text>
      <text x="10" y="44" class="p-title">init</text>
      <text x="10" y="66" class="p-desc">Board and</text>
      <text x="10" y="80" class="p-desc">root scope</text>
      <text x="10" y="94" class="p-desc">registration</text>
    </g>
    <path class="arrow-line" d="M100 55 h12"/>

    <!-- 2: explore -->
    <g transform="translate(118, 0)" filter="url(#cardShadow)">
      <rect width="95" height="110" rx="8" fill="url(#pExplore)"/>
      <text x="10" y="22" class="p-num">02</text>
      <text x="10" y="44" class="p-title">explore</text>
      <text x="10" y="66" class="p-desc">Research,</text>
      <text x="10" y="80" class="p-desc">context &amp;</text>
      <text x="10" y="94" class="p-desc">discovery</text>
    </g>
    <path class="arrow-line" d="M218 55 h12"/>

    <!-- 3: proposal -->
    <g transform="translate(236, 0)" filter="url(#cardShadow)">
      <rect width="95" height="110" rx="8" fill="url(#pProposal)"/>
      <text x="10" y="22" class="p-num">03</text>
      <text x="10" y="44" class="p-title">proposal</text>
      <text x="10" y="66" class="p-desc">Change</text>
      <text x="10" y="80" class="p-desc">intent &amp;</text>
      <text x="10" y="94" class="p-desc">alignment</text>
    </g>
    <path class="arrow-line" d="M336 55 h12"/>

    <!-- 4: spec -->
    <g transform="translate(354, 0)" filter="url(#cardShadow)">
      <rect width="95" height="110" rx="8" fill="url(#pSpec)"/>
      <text x="10" y="22" class="p-num">04</text>
      <text x="10" y="44" class="p-title">spec</text>
      <text x="10" y="66" class="p-desc">Requirements,</text>
      <text x="10" y="80" class="p-desc">scenarios &amp;</text>
      <text x="10" y="94" class="p-desc">acceptance</text>
    </g>
    <path class="arrow-line" d="M454 55 h12"/>

    <!-- 5: design -->
    <g transform="translate(472, 0)" filter="url(#cardShadow)">
      <rect width="95" height="110" rx="8" fill="url(#pDesign)"/>
      <text x="10" y="22" class="p-num">05</text>
      <text x="10" y="44" class="p-title">design</text>
      <text x="10" y="66" class="p-desc">Architecture,</text>
      <text x="10" y="80" class="p-desc">components</text>
      <text x="10" y="94" class="p-desc">&amp; interfaces</text>
    </g>
    <path class="arrow-line" d="M572 55 h12"/>

    <!-- 6: tasks -->
    <g transform="translate(590, 0)" filter="url(#cardShadow)">
      <rect width="95" height="110" rx="8" fill="url(#pTasks)"/>
      <text x="10" y="22" class="p-num">06</text>
      <text x="10" y="44" class="p-title">tasks</text>
      <text x="10" y="66" class="p-desc">Decomposed</text>
      <text x="10" y="80" class="p-desc">work units &amp;</text>
      <text x="10" y="94" class="p-desc">DAG nodes</text>
    </g>
    <path class="arrow-line" d="M690 55 h12"/>

    <!-- 7: apply -->
    <g transform="translate(708, 0)" filter="url(#cardShadow)">
      <rect width="95" height="110" rx="8" fill="url(#pApply)"/>
      <text x="10" y="22" class="p-num">07</text>
      <text x="10" y="44" class="p-title">apply</text>
      <text x="10" y="66" class="p-desc">Claim, lease,</text>
      <text x="10" y="80" class="p-desc">code edit &amp;</text>
      <text x="10" y="94" class="p-desc">execution</text>
    </g>
    <path class="arrow-line" d="M808 55 h12"/>

    <!-- 8: verify -->
    <g transform="translate(826, 0)" filter="url(#cardShadow)">
      <rect width="64" height="110" rx="8" fill="url(#pVerify)"/>
      <text x="10" y="22" class="p-num">08</text>
      <text x="10" y="44" class="p-title">verify</text>
      <text x="10" y="66" class="p-desc">Tests &amp;</text>
      <text x="10" y="80" class="p-desc">reviews</text>
      <text x="10" y="94" class="p-desc">allow/deny</text>
    </g>
  </g>

  <!-- Footer Contract Strip -->
  <g transform="translate(35, 215)">
    <rect width="890" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" font-size="11" font-weight="700" fill="#38bdf8">Immutable Contract Invariant:</text>
    <text x="20" y="42" font-size="10.5" fill="#94a3b8">Each transition produces a canonical SHA-256 digest linked to the parent contract revision and bound to the board's optimistic CAS revision.</text>
  </g>
</svg>
