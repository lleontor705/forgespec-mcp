name: Release

# Actions v5 requires GitHub Actions runner >=2.327.1 (observed runner: 2.336.0).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.3.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Resolve release tag and source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate tag and resolve immutable source
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          TAG="$REQUESTED_TAG"
          VERSION="${TAG#v}"
          if [ "$TAG" = "$VERSION" ] || [[ "$VERSION" == v* ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          if ! npm exec --yes --package=semver@7.7.4 -- node -e 'const path = require("node:path"); const semver = require(path.join(process.env.PATH.split(path.delimiter)[0], "..", "semver")); process.exit(semver.valid(process.argv[1]) === null ? 1 : 0)' "$VERSION"; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          git cat-file -e "$SOURCE_SHA^{commit}"
          node .github/scripts/release-policy.mjs assert-dispatch \
            "$EVENT_NAME" "$EVENT_REF_TYPE" "$EVENT_REF_NAME" "$EVENT_SHA" "$TAG" "$SOURCE_SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  node22-compatibility-gate:
    name: Node 22 compatibility gate
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Cache npm downloads only
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-22.x-${{ hashFiles('package-lock.json') }}
      - name: Install clean Node 22 dependencies
        run: npm ci
      - name: Record Node 22 native runtime evidence
        shell: bash
        run: |
          node --version
          npm --version
          node -e "const b=require('better-sqlite3'); const db=new b(':memory:'); const sqlite=db.prepare('select sqlite_version() as version').get().version; console.log(JSON.stringify({node:process.version,npm:process.env.npm_config_user_agent,modules:process.versions.modules,napi:process.versions.napi,sqlite,betterSqlite3Loaded:true})); if (process.versions.modules !== '127') process.exit(1); db.close()"
      - name: Run full Node 22 test suite
        run: npm test
      - name: Run Node 22 migrations and native handshake
        run: npm test -- --run tests/migrations.test.ts
      - name: Run Node 22 runtime smoke CLI
        run: node --import tsx/esm src/runtime/runtime-smoke.ts --mode source --entrypoint src/index.ts --expected-abi 127

  release-node24:
    name: Verify release on Node 24.18.1
    runs-on: ubuntu-latest
    needs: [prepare-release, node22-compatibility-gate]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
      - name: Cache npm downloads only
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-24.18.1-${{ hashFiles('package-lock.json') }}
      - name: Install clean Node 24.18.1 dependencies
        run: npm ci
      - name: Record exact Node 24 native runtime evidence
        shell: bash
        run: |
          node --version
          npm --version
          node -e "const b=require('better-sqlite3'); const db=new b(':memory:'); const sqlite=db.prepare('select sqlite_version() as version').get().version; console.log(JSON.stringify({node:process.version,npm:process.env.npm_config_user_agent,modules:process.versions.modules,napi:process.versions.napi,sqlite,betterSqlite3Loaded:true})); if (process.version !== 'v24.18.1' || process.versions.modules !== '137') process.exit(1); db.close()"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Run migrations and temporary MCP handshake
        run: npm test -- --run tests/migrations.test.ts
      - name: Run exact Node 24 runtime smoke CLI
        run: node --import tsx/esm src/runtime/runtime-smoke.ts --mode source --entrypoint src/index.ts --expected-abi 137
      - name: Run built runtime smoke CLI
        run: node build/runtime/runtime-smoke.js --mode build --entrypoint build/index.js --expected-abi 137
      - name: Validate packed manifest without publishing
        shell: bash
        run: |
          npm pack --json > pack-manifest.json
          TARBALL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('pack-manifest.json','utf8'))[0].filename)")
          tar -xOf "$TARBALL" package/package.json > packed-package.json
          node -e "const p=require('./packed-package.json'); if (p.bin?.['forgespec-mcp'] !== 'build/index.js') process.exit(1); if (!p.files?.includes('build')) process.exit(1); console.log(JSON.stringify({tarball:process.env.TARBALL,bin:p.bin}))"
          rm -f "$TARBALL" pack-manifest.json packed-package.json

  approve-release:
    name: Approve Release
    runs-on: ubuntu-latest
    needs: [prepare-release, node22-compatibility-gate, release-node24]
    environment: production
    steps:
      - run: echo "Release approved after Node22 compatibility and Node24.18.1 verification."

  publish:
    name: Publish verified Node 24.18.1 release
    needs: [prepare-release, node22-compatibility-gate, release-node24, approve-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          registry-url: https://registry.npmjs.org
      - name: Cache npm downloads only
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-24.18.1-publish-${{ hashFiles('package-lock.json') }}
      - name: Install clean publish dependencies
        run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify release source
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          TAG_SHA=$(git rev-list -n 1 "refs/tags/$TAG")
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$TAG_SHA" = "$SOURCE_SHA"
      - name: Set package version
        run: npm version "${{ needs.prepare-release.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Validate packed manifest before publish
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          npm pack --json > pack-manifest.json
          TARBALL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('pack-manifest.json','utf8'))[0].filename)")
          tar -xOf "$TARBALL" package/package.json > packed-package.json
          node -e "const p=require('./packed-package.json'); if (p.version !== process.env.EXPECTED_VERSION) process.exit(1); if (p.bin?.['forgespec-mcp'] !== 'build/index.js') process.exit(1); console.log('packed manifest verified; publish is the only publishing step')"
      - name: Verify remote tag immediately before npm publication
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: node .github/scripts/release-policy.mjs verify-remote-tag "$TAG" "$SOURCE_SHA"
      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify remote tag immediately before GitHub release handling
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: node .github/scripts/release-policy.mjs verify-remote-tag "$TAG" "$SOURCE_SHA"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          RELEASE_STATE=$(node .github/scripts/release-policy.mjs lookup-github-release "$TAG")
          if [ "$RELEASE_STATE" = "exists" ]; then
            echo "GitHub release already exists: $TAG"
          elif [ "$RELEASE_STATE" = "missing" ]; then
            gh release create "$TAG" --verify-tag --target "$SOURCE_SHA" --title "$TAG" --generate-notes
          else
            echo "Unexpected GitHub release lookup state: $RELEASE_STATE" >&2
            exit 1
          fi
