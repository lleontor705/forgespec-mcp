name: Release

# Actions v5 requires GitHub Actions runner >=2.327.1 (observed runner: 2.336.0).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New version tag (e.g. v1.5.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  prepare-release:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
      - name: Validate new tag and immutable source
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [ "$TAG" = "$VERSION" ] || [[ "$VERSION" == v* ]]; then
            echo "Invalid release tag: $TAG (this workflow publishes stable releases only; expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          if ! npm exec --yes --package=semver@7.7.4 -- node -e 'const path = require("node:path"); const semver = require(path.join(process.env.PATH.split(path.delimiter)[0], "..", "semver")); const version = process.argv[1]; process.exit(semver.valid(version) !== null && semver.prerelease(version) === null && semver.parse(version).build.length === 0 ? 0 : 1)' "$VERSION"; then
            echo "Invalid release tag: $TAG (this workflow publishes stable releases only; expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node .github/scripts/release-policy.mjs assert-remote-tag-absent "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  release-node24:
    name: Verify release on Node 24.18.1
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
      - name: Cache npm downloads only
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-24.18.1-${{ hashFiles('package-lock.json') }}
      - name: Install clean Node 24.18.1 dependencies
        run: npm ci --ignore-scripts
      - name: Record exact Node 24 native runtime evidence
        shell: bash
        run: |
          node --version
          npm --version
          node -e "const b=require('better-sqlite3'); const db=new b(':memory:'); const sqlite=db.prepare('select sqlite_version() as version').get().version; console.log(JSON.stringify({node:process.version,npm:process.env.npm_config_user_agent,modules:process.versions.modules,napi:process.versions.napi,sqlite,betterSqlite3Loaded:true})); if (process.version !== 'v24.18.1' || process.versions.modules !== '137') process.exit(1); db.close()"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Pack release artifacts before host verification
        shell: bash
        run: |
          rm -rf .release-artifacts
          mkdir -p .release-artifacts
          npm pack --json --ignore-scripts --pack-destination .release-artifacts > .release-artifacts/root-pack.json
           npm pack ./plugins/opencode-forgespec --json --ignore-scripts --pack-destination .release-artifacts > .release-artifacts/plugin-pack.json
      - name: Install pinned official OpenCode host
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode-host" --ignore-scripts --omit=peer --package-lock=false opencode-ai@1.18.3
          echo "$RUNNER_TEMP/opencode-host/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify actual OpenCode host against packed plugin URL
        run: node scripts/verify-opencode-host.mjs --mode=packed --artifacts-dir="$GITHUB_WORKSPACE/.release-artifacts"
      - name: Run exact Node 24 runtime smoke CLI
        run: node --import tsx/esm src/runtime/runtime-smoke.ts --mode source --entrypoint src/index.ts --expected-abi 137
      - name: Run built runtime smoke CLI
        run: node build/runtime/runtime-smoke.js --mode build --entrypoint build/index.js --expected-abi 137
      - name: Validate packed manifest without publishing
        shell: bash
        run: |
          npm run build
          npm pack --json --ignore-scripts > pack-manifest.json
          TARBALL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('pack-manifest.json','utf8'))[0].filename)")
          tar -xOf "$TARBALL" package/package.json > packed-package.json
          node -e "const p=require('./packed-package.json'); if (p.bin?.['forgespec-mcp'] !== 'build/index.js') process.exit(1); if (!p.files?.includes('build')) process.exit(1); console.log(JSON.stringify({bin:p.bin}))"
          PLUGIN_TARBALL=$(npm pack ./plugins/opencode-forgespec --json --ignore-scripts | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).at(-1).filename))")
          test -s "$PLUGIN_TARBALL"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('plugins/opencode-forgespec/package.json')); if(p.name!=='opencode-forgespec'||p.dependencies?.['forgespec-mcp']!==p.version||!p.files?.includes('index.js')) process.exit(1)"
          TMP=$(mktemp -d); npm init --yes --prefix "$TMP" >/dev/null 2>&1
          npm install --prefix "$TMP" --ignore-scripts --omit=peer --package-lock=false "$(pwd)/$TARBALL" "$(pwd)/$PLUGIN_TARBALL"
          export FORGESPEC_DB="$TMP/domain.db" FORGESPEC_IDENTITY_SIDECAR_PATH="$TMP/identity.db" FORGESPEC_CURSOR_SECRET="release-packed-cursor-secret-0123456789012345"
          PLUGIN_URL="file://$(realpath "$TMP/node_modules/opencode-forgespec/index.js")"
          (cd "$TMP" && PLUGIN_URL="$PLUGIN_URL" node --input-type=module -e "import { Client } from '@modelcontextprotocol/sdk/client/index.js'; import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js'; const p=await import(process.env.PLUGIN_URL); if(typeof p.default!=='function') process.exit(1); const hooks=await p.default({client:{session:{get:async()=>({data:{id:'gate'}})}}}); const cfg={mcp:{}}; await hooks.config(cfg); const entry=cfg.mcp.forgespec; if(!entry?.command?.length) process.exit(1); const transport=new StdioClientTransport({command:entry.command[0],args:entry.command.slice(1),env:{...process.env,...entry.environment}}); const mcp=new Client({name:'release-gate',version:'1'}); await mcp.connect(transport); const call={args:{}}; await hooks['tool.execute.before']({tool:'forgespec_forge_health',sessionID:'gate',callID:'release-gate'}, call); const result=await mcp.callTool({name:'forge_health',arguments:call.args}); if(result.isError||result.structuredContent?.ok!==true||result.structuredContent?.data?.storage?.qualified!==true) process.exit(1); await mcp.close(); await hooks.dispose(); console.log('packed file-url OpenCode MCP connection and signed health passed')")
          npm exec --prefix "$TMP" --yes --package=opencode-ai@1.18.3 -- opencode --version
          (cd "$TMP" && node --input-type=module -e "const m=await import('forgespec-mcp/mcp'); if(typeof m.default!=='function'&&typeof m.createServer!=='function') process.exit(1); console.log('packed MCP entrypoint loaded; signed health is covered by runtime gate')")
          rm -rf "$TMP" "$TARBALL" "$PLUGIN_TARBALL" pack-manifest.json packed-package.json

  approve-release:
    name: Approve Release
    runs-on: ubuntu-latest
    needs: [prepare-release, release-node24]
    environment: production
    steps:
      - run: echo "Release approved after final Node 24.18.1 verification."

  publish:
    name: Publish verified Node 24.18.1 release
    needs: [prepare-release, release-node24, approve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.18.1"
          registry-url: https://registry.npmjs.org
      - name: Cache npm downloads only
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-24.18.1-publish-${{ hashFiles('package-lock.json') }}
      - name: Install clean publish dependencies
        run: npm ci --ignore-scripts
      - name: Build package contents from verified source
        run: npm run build
      - name: Set package version without lifecycle scripts
        run: npm version "${{ needs.prepare-release.outputs.version }}" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Align standalone plugin version without lifecycle scripts
        run: npm version "${{ needs.prepare-release.outputs.version }}" --prefix plugins/opencode-forgespec --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Align plugin dependency version without lifecycle scripts
        run: npm pkg set dependencies.forgespec-mcp="${{ needs.prepare-release.outputs.version }}" --prefix plugins/opencode-forgespec
      - name: Validate packed manifest before publish
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          npm pack --json --ignore-scripts > pack-manifest.json
          TARBALL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('pack-manifest.json','utf8'))[0].filename)")
          tar -xOf "$TARBALL" package/package.json > packed-package.json
          node -e "const p=require('./packed-package.json'); if (p.version !== process.env.EXPECTED_VERSION) process.exit(1); if (p.bin?.['forgespec-mcp'] !== 'build/index.js') process.exit(1); if (!p.files?.includes('build')) process.exit(1); console.log('packed manifest verified')"
          npm pack ./plugins/opencode-forgespec --json --ignore-scripts > plugin-pack-manifest.json
          PLUGIN_TARBALL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('plugin-pack-manifest.json','utf8')).at(-1).filename)")
          node -e "const p=require('./plugins/opencode-forgespec/package.json'); if (p.version !== process.env.EXPECTED_VERSION || p.dependencies?.['forgespec-mcp'] !== process.env.EXPECTED_VERSION) process.exit(1)"
          rm -f "$TARBALL" "$PLUGIN_TARBALL" pack-manifest.json plugin-pack-manifest.json packed-package.json
      - name: Re-check source and remote tag immediately before mutation
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          node .github/scripts/release-policy.mjs assert-remote-tag-absent "$TAG"
      - name: Create and push annotated release tag
        id: push_tag
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$EXPECTED_SOURCE_SHA" --message "Release $TAG"
          git push --no-verify origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Verify pushed tag source
        id: verify_tag
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: node .github/scripts/release-policy.mjs verify-remote-tag "$TAG" "$EXPECTED_SOURCE_SHA"
      - name: Publish root package to npm
        id: publish_npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish standalone OpenCode plugin package to npm
        run: npm publish ./plugins/opencode-forgespec --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Retry npm visibility and signed health assertion
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
             npm view "forgespec-mcp@$VERSION" version --json && npm view "opencode-forgespec@$VERSION" version --json && break
             test "$attempt" -lt 5 || exit 1
             sleep $((attempt * 5))
           done
           test "$(npm view "forgespec-mcp@$VERSION" version)" = "$VERSION"
           test "$(npm view "opencode-forgespec@$VERSION" version)" = "$VERSION"
            POST_TMP=$(mktemp -d)
            npm init --yes --prefix "$POST_TMP" >/dev/null 2>&1
             npm install --prefix "$POST_TMP" --ignore-scripts --omit=peer --package-lock=false "opencode-forgespec@$VERSION" "forgespec-mcp@$VERSION"
             (cd "$POST_TMP" && node "$GITHUB_WORKSPACE/scripts/verify-opencode-host.mjs" --mode=registry)
            export FORGESPEC_DB="$POST_TMP/domain.db" FORGESPEC_IDENTITY_SIDECAR_PATH="$POST_TMP/identity.db" FORGESPEC_CURSOR_SECRET="release-registry-cursor-secret-0123456789012345"
            (cd "$POST_TMP" && node --input-type=module -e "import { Client } from '@modelcontextprotocol/sdk/client/index.js'; import { StdioClientTransport } from '@modelcontextprotocol/sdk/client/stdio.js'; const p=await import('opencode-forgespec'); if(typeof p.default!=='function') process.exit(1); const hooks=await p.default({client:{session:{get:async()=>({data:{id:'postpublish-gate'}})}}}); const cfg={mcp:{}}; await hooks.config(cfg); const e=cfg.mcp.forgespec; const t=new StdioClientTransport({command:e.command[0],args:e.command.slice(1),env:{...process.env,...e.environment}}); const m=new Client({name:'postpublish-gate',version:'1'}); await m.connect(t); const call={args:{}}; await hooks['tool.execute.before']({tool:'forgespec_forge_health',sessionID:'postpublish-gate',callID:'postpublish-gate'}, call); const r=await m.callTool({name:'forge_health',arguments:call.args}); if(r.isError||r.structuredContent?.ok!==true||r.structuredContent?.data?.storage?.qualified!==true) process.exit(1); await m.close(); await hooks.dispose(); console.log('registry package-spec OpenCode MCP connection and signed health passed')")
            rm -rf "$POST_TMP"
      - name: Re-verify pushed tag source before GitHub release
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: node .github/scripts/release-policy.mjs verify-remote-tag "$TAG" "$EXPECTED_SOURCE_SHA"
      - name: Create GitHub release for verified tag
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
      - name: Report partial release state
        if: failure() && steps.push_tag.outcome != 'skipped'
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          echo "Release mutation failed or could not be verified; do not rerun this new-tag workflow blindly." >&2
          echo "Reconcile manually: verify refs/tags/$TAG peels to $EXPECTED_SOURCE_SHA, inspect npm view forgespec-mcp@$VERSION, and inspect gh release view $TAG." >&2
          echo "Complete only the missing external operation after proving the existing tag/package/release state matches this source and version." >&2
          exit 1
